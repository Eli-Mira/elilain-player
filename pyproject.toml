[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elilain-player"
version = "0.1.0"
description = "A quiet, native Lain-themed local music player"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "mutagen>=1.47", "Pillow>=10"]

[project.gui-scripts]
elilain-player = "elilain_player.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elilain_player*"]

[tool.setuptools.package-data]
elilain_player = ["quick/*.qml", "assets/*.png", "assets/*.ico", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
